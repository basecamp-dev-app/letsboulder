name = "media-worker"
main = "src/index.ts"
compatibility_date = "2026-03-22"

[observability]
enabled = true

[vars]
ENABLE_MODERATION = "false"
MEDIA_MODERATION_PROVIDER = "disabled"
MEDIA_HOST = "https://static.letsboulder.com"

[env.staging]
name = "media-worker-staging"

[env.staging.vars]
ENABLE_MODERATION = "false"
MEDIA_MODERATION_PROVIDER = "disabled"
MEDIA_HOST = "https://static.dev.letsboulder.com"
SUPABASE_URL = "https://pfleqxztfiddujvylvaz.supabase.co"
R2_PRIVATE_BUCKET = "lb-dev-media-private"
R2_PUBLIC_BUCKET = "lb-dev-media-public"

[[env.staging.queues.producers]]
binding = "MEDIA_QUEUE"
queue = "media-transform-queue-staging"

[[env.staging.queues.consumers]]
queue = "media-transform-queue-staging"
max_batch_size = 1

[[env.staging.r2_buckets]]
binding = "ORIGINALS_BUCKET"
bucket_name = "lb-dev-media-private"

[[env.staging.r2_buckets]]
binding = "PUBLIC_BUCKET"
bucket_name = "lb-dev-media-public"

