name: Sync Dev

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-to-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward dev to main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main dev
          git switch --create dev --track origin/dev
          git merge --ff-only origin/main
          git push origin HEAD:dev
