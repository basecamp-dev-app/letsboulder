name: Production Media Reconciliation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-media-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile production media
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      SUPABASE_DB_HOST: ${{ vars.SUPABASE_DB_HOST }}
      SUPABASE_DB_PORT: ${{ vars.SUPABASE_DB_PORT }}
      SUPABASE_DB_USER: ${{ vars.SUPABASE_DB_USER }}
      SUPABASE_DB_NAME: ${{ vars.SUPABASE_DB_NAME }}
      RECONCILIATION_OUTPUT: production-media-reconciliation.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Validate required configuration
        shell: bash
        run: |
          required_vars=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            SUPABASE_DB_HOST
            SUPABASE_DB_PORT
            SUPABASE_DB_USER
            SUPABASE_DB_NAME
            PGPASSWORD
          )
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required configuration: $var"
              exit 1
            fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Run read-only reconciliation
        run: npx tsx scripts/media/reconcile-r2-media.ts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Upload reconciliation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-media-reconciliation
          path: production-media-reconciliation.json
          if-no-files-found: error
          retention-days: 7
