name: Fix MapLibre imports v2

on:
  push:
    branches:
      - fix/automate-production-release
    paths:
      - '.github/workflows/fix-maplibre-imports-v2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/automate-production-release
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Update imports
        run: |
          perl -0pi -e "s/import maplibregl, \{ type Map as MapLibreMap, type Marker \} from 'maplibre-gl'/import * as maplibregl from 'maplibre-gl'\nimport type { Map as MapLibreMap, Marker } from 'maplibre-gl'/g" components/map/MapLibreLocationPicker.tsx components/map/MapLibreStaticLocationMap.tsx
          perl -0pi -e "s/import maplibregl, \{ type GeoJSONSource, type Map as MapLibreMap \} from 'maplibre-gl'/import * as maplibregl from 'maplibre-gl'\nimport type { GeoJSONSource, Map as MapLibreMap } from 'maplibre-gl'/g" components/map/MapLibreVectorMap.tsx
          perl -0pi -e "s/markerRef\.current\.on\('dragend'/markerRef.current!.on('dragend'/g" components/map/MapLibreLocationPicker.tsx
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify app typecheck
        run: npm run typecheck:app
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/map/MapLibreLocationPicker.tsx components/map/MapLibreStaticLocationMap.tsx components/map/MapLibreVectorMap.tsx
          git commit -m 'fix: update MapLibre 6 imports'
          git push origin HEAD:fix/automate-production-release
