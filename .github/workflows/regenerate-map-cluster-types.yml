name: Regenerate map cluster database types

on:
  push:
    branches:
      - fix/map-cluster-bounds-ux

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/map-cluster-bounds-ux
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Start local Supabase
        run: npx --no-install supabase start

      - name: Reset local database
        run: npx --no-install supabase db reset

      - name: Regenerate database types
        run: npx --no-install supabase gen types typescript --local > types/database.ts

      - name: Commit generated types
        run: |
          if git diff --quiet -- types/database.ts; then
            echo "Database types already match the migrated schema."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add types/database.ts
          git commit -m "Regenerate database types for cluster bounds"
          git push origin HEAD:fix/map-cluster-bounds-ux

      - name: Stop local Supabase
        if: always()
        run: npx --no-install supabase stop || true
