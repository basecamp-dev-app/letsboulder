name: Media Worker Tail

on:
  workflow_dispatch:
    inputs:
      tail_seconds:
        description: Seconds to capture production worker logs
        required: true
        default: "90"

permissions:
  contents: read

jobs:
  tail-production:
    name: Tail Media Worker (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"

      - name: Validate tail duration
        shell: bash
        env:
          TAIL_SECONDS: ${{ inputs.tail_seconds }}
        run: |
          if ! [[ "$TAIL_SECONDS" =~ ^[0-9]+$ ]] || [ "$TAIL_SECONDS" -lt 1 ] || [ "$TAIL_SECONDS" -gt 240 ]; then
            echo '::error::tail_seconds must be an integer between 1 and 240'
            exit 1
          fi

      - name: Capture production logs
        working-directory: apps/media-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TAIL_SECONDS: ${{ inputs.tail_seconds }}
        run: |
          set +e
          timeout "${TAIL_SECONDS}s" npx --yes wrangler@3.90.0 tail --env production --format json \
            > media-worker-tail.log 2>&1
          status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            cat media-worker-tail.log
            exit "$status"
          fi

      - name: Upload production logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media-worker-tail
          path: apps/media-worker/media-worker-tail.log
          if-no-files-found: error
          retention-days: 7
