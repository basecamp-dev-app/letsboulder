name: Media Worker Deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/media-worker/**"
      - ".github/workflows/media-worker-deploy.yml"
  workflow_dispatch:
    inputs:
      allow_known_config_convergence:
        description: "Incident-only: allow one non-strict production Worker version upload"
        required: false
        default: false
        type: boolean
      expected_main_sha:
        description: "Required with convergence: exact main commit SHA being deployed"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: media-worker-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy Media Worker (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: apps/media-worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/media-worker

      - name: Typecheck media worker
        run: npm run check
        working-directory: apps/media-worker

      - name: Validate production media worker deployment inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_CF_MEDIA_WORKER_URL: ${{ vars.CF_MEDIA_WORKER_URL }}
          GITHUB_MEDIA_CDN_URL: ${{ vars.NEXT_PUBLIC_MEDIA_CDN_URL }}
        run: |
          set -euo pipefail

          required=(CLOUDFLARE_API_TOKEN SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY GITHUB_CF_MEDIA_WORKER_URL GITHUB_MEDIA_CDN_URL)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required in the protected Production GitHub environment."
              exit 1
            fi
          done

          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[[:alnum:]_-]+$ ]]; then
            echo '::error::CLOUDFLARE_ACCOUNT_ID is missing or invalid in the Production GitHub environment.'
            exit 1
          fi

          target='https://static.letsboulder.com'
          for name in GITHUB_CF_MEDIA_WORKER_URL GITHUB_MEDIA_CDN_URL; do
            value="${!name}"
            if [ "${value%/}" != "$target" ]; then
              echo "::error::$name must point to $target before production routing is migrated."
              exit 1
            fi
          done

          # NEXT_PUBLIC_SUPABASE_ANON_KEY is a public Worker var, not a secret
          # binding. Mask it anyway so Wrangler diagnostics cannot echo it.
          echo "::add-mask::$SUPABASE_ANON_KEY"

      - name: Authorize one-time production configuration convergence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_known_config_convergence }}
        env:
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo '::error::Known production configuration convergence may run only from main.'
            exit 1
          fi

          if [ -z "$EXPECTED_MAIN_SHA" ]; then
            echo '::error::expected_main_sha is required when known configuration convergence is enabled.'
            exit 1
          fi

          if [ "$EXPECTED_MAIN_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::expected_main_sha must exactly match the checked-out main commit ($GITHUB_SHA)."
            exit 1
          fi

          echo '::warning::Incident-only production Worker configuration convergence is explicitly authorized for this exact main commit.'

      - name: Preview production route and cron reconciliation
        working-directory: apps/media-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID

          npx --no-install wrangler triggers deploy --env production --dry-run

      - name: Reconcile production routes and cron before version upload
        working-directory: apps/media-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID

          # versions upload does not apply routes/domains or cron. Reconcile
          # those triggers first so the reviewed Custom Domains and cron are
          # present before either the normal strict upload or the incident-only
          # configuration convergence upload.
          npx --no-install wrangler triggers deploy --env production

      - name: Reconcile production queue consumer
        working-directory: apps/media-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID

          consumers="$(npx --no-install wrangler queues consumer list media-transform-queue-prod --json)"
          if printf '%s' "$consumers" | grep -Fq 'media-worker-production'; then
            echo 'Production media queue consumer already exists.'
          else
            npx --no-install wrangler queues consumer add \
              media-transform-queue-prod \
              media-worker-production \
              --batch-size 1 \
              --batch-timeout 5 \
              --message-retries 3
          fi

          consumers="$(npx --no-install wrangler queues consumer list media-transform-queue-prod --json)"
          if ! printf '%s' "$consumers" | grep -Fq 'media-worker-production'; then
            echo '::error::Production media queue consumer was not reconciled.'
            exit 1
          fi

      - name: Create production Worker version with synchronized credentials
        working-directory: apps/media-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CF_MEDIA_WORKER_SECRET: ${{ secrets.CF_MEDIA_WORKER_SECRET }}
          WORKER_VERSION_TAG: github-${{ github.sha }}
          ALLOW_KNOWN_CONFIG_CONVERGENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_known_config_convergence && 'true' || 'false' }}
        run: |
          set -euo pipefail

          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID
          echo "::add-mask::$SUPABASE_ANON_KEY"
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "${CF_MEDIA_WORKER_SECRET:-}" ]; then
            echo "::add-mask::$CF_MEDIA_WORKER_SECRET"
          fi

          INCIDENT_INGRESS_SECRET=''
          INCIDENT_INTERNAL_ORIGIN_SECRET=''
          if [ "$ALLOW_KNOWN_CONFIG_CONVERGENCE" = "true" ]; then
            current_secrets="$(npx --no-install wrangler secret list --env production --format json)"
            has_secret() {
              node -e 'const list=JSON.parse(process.argv[1]); process.exit(list.some(item => item.name === process.argv[2]) ? 0 : 1)' "$current_secrets" "$1"
            }

            if ! has_secret INGRESS_SECRET; then
              if [ -z "${CF_MEDIA_WORKER_SECRET:-}" ]; then
                echo '::error::Production INGRESS_SECRET is missing and CF_MEDIA_WORKER_SECRET is unavailable to restore it safely.'
                exit 1
              fi
              INCIDENT_INGRESS_SECRET="$CF_MEDIA_WORKER_SECRET"
              export INCIDENT_INGRESS_SECRET
              echo "::add-mask::$INCIDENT_INGRESS_SECRET"
              echo '::warning::Seeding missing INGRESS_SECRET from the protected app enqueue secret for this convergence upload.'
            fi

            if ! has_secret INTERNAL_ORIGIN_SECRET; then
              INCIDENT_INTERNAL_ORIGIN_SECRET="$(openssl rand -hex 32)"
              export INCIDENT_INTERNAL_ORIGIN_SECRET
              echo "::add-mask::$INCIDENT_INTERNAL_ORIGIN_SECRET"
              echo '::warning::Seeding missing INTERNAL_ORIGIN_SECRET with a fresh production-only value for this convergence upload.'
            fi
          fi

          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          chmod 600 "$secrets_file"
          node -e 'const fs=require("fs"); const payload={SUPABASE_SERVICE_ROLE_KEY: process.env.SUPABASE_SERVICE_ROLE_KEY}; if (process.env.INCIDENT_INGRESS_SECRET) payload.INGRESS_SECRET=process.env.INCIDENT_INGRESS_SECRET; if (process.env.INCIDENT_INTERNAL_ORIGIN_SECRET) payload.INTERNAL_ORIGIN_SECRET=process.env.INCIDENT_INTERNAL_ORIGIN_SECRET; fs.writeFileSync(process.argv[1], JSON.stringify(payload))' "$secrets_file"

          # Existing omitted secrets are preserved. The incident-only path may
          # seed a required secret only when Cloudflare reports it missing;
          # ordinary strict uploads keep preserving those secret values.
          strict_args=(--strict)
          if [ "$ALLOW_KNOWN_CONFIG_CONVERGENCE" = "true" ]; then
            strict_args=()
            echo '::warning::Using the reviewed incident-only non-strict upload to converge known production Worker configuration drift.'
          fi

          npx --no-install wrangler versions upload \
            --env production \
            "${strict_args[@]}" \
            --tag "$WORKER_VERSION_TAG" \
            --message "GitHub ${GITHUB_SHA}" \
            --var "SUPABASE_ANON_KEY:${SUPABASE_ANON_KEY}" \
            --secrets-file "$secrets_file"

      - name: Apply production routes and cron for synchronized config
        working-directory: apps/media-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID

          npx --no-install wrangler triggers deploy --env production

      - name: Deploy synchronized production Worker version
        working-directory: apps/media-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_VERSION_TAG: github-${{ github.sha }}
        run: |
          set -euo pipefail
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          export CLOUDFLARE_ACCOUNT_ID

          npx --no-install wrangler versions deploy \
            --env production \
            --version-tag "${WORKER_VERSION_TAG}@100%" \
            --message "Deploy ${GITHUB_SHA}" \
            --yes

      - name: Smoke test production media endpoint
        env:
          ALLOW_KNOWN_CONFIG_CONVERGENCE: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_known_config_convergence && 'true' || 'false' }}
        run: |
          set -euo pipefail

          status="$(curl --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 --output /dev/null --write-out '%{http_code}' --request POST https://static.letsboulder.com/enqueue)"
          if [ "$status" != "401" ]; then
            echo "::error::Expected 401 from production media worker, got $status"
            exit 1
          fi

          echo 'Production media worker is reachable on the canonical Custom Domain and ingress auth is enforced.'
          if [ "$ALLOW_KNOWN_CONFIG_CONVERGENCE" = "true" ]; then
            echo 'Controlled production Worker configuration convergence completed; subsequent deployments must use the default strict upload path.'
          fi
