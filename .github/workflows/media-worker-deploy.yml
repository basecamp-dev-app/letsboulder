name: Media Worker Deploy

on:
  push:
    branches:
      - main
    paths:
      - "apps/media-worker/**"
      - ".github/workflows/media-worker-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: media-worker-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy Media Worker (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: apps/media-worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/media-worker

      - name: Typecheck media worker
        run: npm run check
        working-directory: apps/media-worker

      - name: Upload production media worker secrets
        working-directory: apps/media-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo '::error::NEXT_PUBLIC_SUPABASE_ANON_KEY is required for production media delivery.'
            exit 1
          fi
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[[:alnum:]_-]+$ ]]; then
            echo '::error::CLOUDFLARE_ACCOUNT_ID is missing or invalid after whitespace normalization.'
            exit 1
          fi
          export CLOUDFLARE_ACCOUNT_ID
          printf '%s' "$SUPABASE_ANON_KEY" \
            | npx --no-install wrangler secret put SUPABASE_ANON_KEY --env production

      - name: Deploy production media worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/media-worker
          command: deploy --env production
