name: Media Backfill

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview selected rows without enqueueing worker jobs'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      sample_image_id:
        description: 'Optional single images.id to target for a sample run'
        required: false
        type: string
      batch_size:
        description: 'Maximum rows to enqueue per run'
        required: true
        default: '25'
        type: string
      max_rows:
        description: 'Optional hard cap on selected rows'
        required: false
        default: '25'
        type: string
      verify_wait_seconds:
        description: 'Seconds to wait before checking post-enqueue DB state'
        required: false
        default: '20'
        type: string

permissions:
  contents: read

concurrency:
  group: media-backfill-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enqueue-backfill:
    name: Enqueue media backfill jobs
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 75
    env:
      DRY_RUN: ${{ inputs.dry_run }}
      SAMPLE_IMAGE_ID: ${{ inputs.sample_image_id }}
      BATCH_SIZE: ${{ inputs.batch_size }}
      MAX_ROWS: ${{ inputs.max_rows }}
      VERIFY_WAIT_SECONDS: ${{ inputs.verify_wait_seconds }}
      PSQL_SSLMODE: require
      SUPABASE_DB_HOST: ${{ vars.SUPABASE_DB_HOST }}
      SUPABASE_DB_USER: ${{ vars.SUPABASE_DB_USER }}
      SUPABASE_DB_NAME: ${{ vars.SUPABASE_DB_NAME }}
      SUPABASE_DB_PORT: ${{ vars.SUPABASE_DB_PORT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install tooling
        run: |
          if ! command -v jq >/dev/null 2>&1 || ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq postgresql-client
          fi

      - name: Validate required configuration
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CF_MEDIA_WORKER_URL: ${{ vars.CF_MEDIA_WORKER_URL }}
          CF_MEDIA_WORKER_SECRET: ${{ secrets.CF_MEDIA_WORKER_SECRET }}
        run: |
          required_vars=(CF_MEDIA_WORKER_URL CF_MEDIA_WORKER_SECRET SUPABASE_DB_HOST SUPABASE_DB_USER SUPABASE_DB_NAME SUPABASE_DB_PORT PGPASSWORD)
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required configuration: $var"
              exit 1
            fi
          done

          if ! [[ "$BATCH_SIZE" =~ ^[0-9]+$ ]] || [ "$BATCH_SIZE" -le 0 ]; then
            echo "::error::batch_size must be a positive integer"
            exit 1
          fi

          if [ -n "$MAX_ROWS" ] && { ! [[ "$MAX_ROWS" =~ ^[0-9]+$ ]] || [ "$MAX_ROWS" -le 0 ]; }; then
            echo "::error::max_rows must be empty or a positive integer"
            exit 1
          fi
          if [ -n "$MAX_ROWS" ] && [ "$MAX_ROWS" -gt 1000 ]; then
            echo '::error::max_rows must not exceed 1000'
            exit 1
          fi
          if [ "$BATCH_SIZE" -gt 1000 ]; then
            echo '::error::batch_size must not exceed 1000'
            exit 1
          fi
          if [ "$VERIFY_WAIT_SECONDS" -gt 3600 ]; then
            echo '::error::verify_wait_seconds must not exceed 3600'
            exit 1
          fi

          if [ -n "$SAMPLE_IMAGE_ID" ] && ! [[ "$SAMPLE_IMAGE_ID" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::sample_image_id must be a UUID"
            exit 1
          fi

          if ! [[ "$VERIFY_WAIT_SECONDS" =~ ^[0-9]+$ ]] || [ "$VERIFY_WAIT_SECONDS" -lt 0 ]; then
            echo "::error::verify_wait_seconds must be a non-negative integer"
            exit 1
          fi

      - name: Select affected rows and infer purpose
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          limit="$BATCH_SIZE"
          if [ -n "$MAX_ROWS" ] && [ "$MAX_ROWS" -lt "$limit" ]; then
            limit="$MAX_ROWS"
          fi

          query=$(cat <<'SQL'
          WITH candidate_images AS (
            SELECT
              i.id,
              i.original_bucket,
              i.original_key,
              i.created_by,
              CASE
                WHEN EXISTS (
                  SELECT 1
                  FROM public.submission_draft_images sdi
                  WHERE sdi.original_bucket = i.original_bucket
                    AND sdi.original_key = i.original_key
                ) THEN 'draft_image'
                WHEN EXISTS (
                  SELECT 1
                  FROM public.crag_images ci
                  WHERE ci.linked_image_id = i.id
                     OR ci.source_image_id = i.id
                ) THEN 'crag_image'
                ELSE 'submission_image'
              END AS inferred_purpose
            FROM public.images i
            WHERE i.original_bucket = 'lb-prod-media-private'
              AND i.storage_provider = 'r2'
              AND i.original_key ~ ('^images/(assets|originals)/' || i.id::text || '/')
              AND i.optimized_key IS NULL
              AND i.status <> 'deleted'
              AND i.created_by IS NOT NULL
              AND (NULLIF(:'sample_image_id', '') IS NULL OR i.id = NULLIF(:'sample_image_id', '')::uuid)
            ORDER BY i.created_at ASC
            LIMIT :'row_limit'::integer
          )
          SELECT COALESCE(json_agg(row_to_json(candidate_images)), '[]'::json)::text
          FROM candidate_images;
          SQL
          )

          selected=$(psql \
            "host=$SUPABASE_DB_HOST port=$SUPABASE_DB_PORT user=$SUPABASE_DB_USER dbname=$SUPABASE_DB_NAME sslmode=$PSQL_SSLMODE" \
            --no-align --tuples-only --quiet \
            -v sample_image_id="$SAMPLE_IMAGE_ID" \
            -v row_limit="$limit" \
            -c "$query")

          selected=$(printf '%s' "$selected" | tr -d '\n')
          echo "$selected" > selected-images.json

          count=$(jq 'length' selected-images.json)
          echo "Selected $count candidate rows"

          if [ "$count" -eq 0 ]; then
            echo "::warning::No matching rows found"
          fi

      - name: Enqueue worker jobs
        if: ${{ inputs.dry_run == 'false' }}
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          CF_MEDIA_WORKER_URL: ${{ vars.CF_MEDIA_WORKER_URL }}
          CF_MEDIA_WORKER_SECRET: ${{ secrets.CF_MEDIA_WORKER_SECRET }}
        run: |
          success=0
          failure=0
          failed_ids=()

          while IFS= read -r row; do
            image_id=$(printf '%s' "$row" | jq -r '.id')
            original_bucket=$(printf '%s' "$row" | jq -r '.original_bucket')
            original_key=$(printf '%s' "$row" | jq -r '.original_key')
            created_by=$(printf '%s' "$row" | jq -r '.created_by')
            purpose=$(printf '%s' "$row" | jq -r '.inferred_purpose')

            payload=$(jq -n \
              --arg imageId "$image_id" \
              --arg originalBucket "$original_bucket" \
              --arg originalKey "$original_key" \
              --arg purpose "$purpose" \
              --arg triggeredByUserId "$created_by" \
              '{imageId: $imageId, originalBucket: $originalBucket, originalKey: $originalKey, storageProvider: "r2", purpose: $purpose, triggeredByUserId: $triggeredByUserId, trigger: "backfill"}')

            durable_job=$(psql \
              "host=$SUPABASE_DB_HOST port=$SUPABASE_DB_PORT user=$SUPABASE_DB_USER dbname=$SUPABASE_DB_NAME sslmode=$PSQL_SSLMODE" \
              --no-align --tuples-only --quiet \
              -v ON_ERROR_STOP=1 \
              -v image_id="$image_id" \
              -v original_bucket="$original_bucket" \
              -v original_key="$original_key" \
              -v purpose="$purpose" \
              -v created_by="$created_by" \
              -c "set role service_role; select set_config('request.jwt.claims', '{\"role\":\"service_role\"}', false); select id from public.queue_media_ingest_job(:'image_id'::uuid, :'original_bucket', :'original_key', 'r2', :'purpose', :'created_by'::uuid, 'backfill', false); reset role")
            if [ -z "$durable_job" ]; then
              failure=$((failure + 1))
              failed_ids+=("$image_id")
              printf '::error::Failed to create durable ingest job for %s\n' "$image_id"
              continue
            fi

            response_file=$(mktemp)
            status_code=$(curl -sS -o "$response_file" -w '%{http_code}' \
              -X POST "${CF_MEDIA_WORKER_URL%/}/enqueue" \
              -H "Authorization: Bearer $CF_MEDIA_WORKER_SECRET" \
              -H 'Content-Type: application/json' \
              --data "$payload")

            if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 300 ]; then
              success=$((success + 1))
              printf 'Enqueued %s (%s)\n' "$image_id" "$purpose"
            else
              failure=$((failure + 1))
              failed_ids+=("$image_id")
              printf '::error::Failed to enqueue %s (HTTP %s)\n' "$image_id" "$status_code"
            fi

            rm -f "$response_file"
          done < <(jq -c '.[]' selected-images.json)

          printf 'Enqueue summary: success=%s failure=%s\n' "$success" "$failure"
          if [ "$failure" -gt 0 ]; then
            printf 'Failed image IDs: %s\n' "${failed_ids[*]}"
            exit 1
          fi

      - name: Verify post-enqueue DB state
        if: ${{ inputs.dry_run == 'false' }}
        shell: bash
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ "$VERIFY_WAIT_SECONDS" -gt 0 ]; then
            echo "Waiting $VERIFY_WAIT_SECONDS seconds for worker finalization"
            sleep "$VERIFY_WAIT_SECONDS"
          fi

          selected_ids=$(jq -c '[.[].id]' selected-images.json)
          if [ "$selected_ids" = '[]' ]; then
            echo '::warning::No selected rows to verify'
            exit 0
          fi

          verify_query=$(cat <<'SQL'
          SELECT json_agg(row_to_json(verified_rows))::text
          FROM (
            SELECT
              id,
              url,
              visibility,
              processing_status,
              processed_at,
              optimized_key,
              variants
            FROM public.images
            WHERE id IN (
              SELECT value::uuid
              FROM jsonb_array_elements_text(:'selected_ids'::jsonb)
            )
            ORDER BY id ASC
          ) AS verified_rows;
          SQL
          )

          verified=$(psql \
            "host=$SUPABASE_DB_HOST port=$SUPABASE_DB_PORT user=$SUPABASE_DB_USER dbname=$SUPABASE_DB_NAME sslmode=$PSQL_SSLMODE" \
            --no-align --tuples-only --quiet \
            -v selected_ids="$selected_ids" \
            -c "$verify_query")

          verified=$(printf '%s' "$verified" | tr -d '\n')
          echo "$verified" > verified-images.json
          echo "Verified image rows: $(jq 'length' verified-images.json)"

          unresolved_count=$(jq '[.[] | select(.processing_status != "ready" or .processed_at == null or .optimized_key == null or (.url | startswith("private://")) or .variants == {})] | length' verified-images.json)
          if [ "$unresolved_count" -gt 0 ]; then
            echo "::warning::Some images are still unresolved after enqueue"
            exit 1
          fi

      - name: Dry run summary
        if: ${{ inputs.dry_run == 'true' }}
        run: |
          echo 'Dry run only. No worker jobs were enqueued.'
