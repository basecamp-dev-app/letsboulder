name: Refresh release security dependencies

on:
  push:
    branches:
      - fix/automate-production-release
    paths:
      - '.github/workflows/refresh-release-security-deps.yml'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/automate-production-release

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Update patched dependency ranges
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.dependencies['maplibre-gl'] = '^6.4.1'
          pkg.overrides['js-yaml'] = '^4.3.2'
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`)
          NODE

      - name: Refresh npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit dependency refresh
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes to commit.'
            exit 0
          fi
          git commit -m 'chore: patch release security dependencies'
          git push origin HEAD:fix/automate-production-release
