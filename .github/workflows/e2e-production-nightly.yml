name: E2E Production Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-production-nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-safe-e2e:
    name: Production-Safe E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      IMAGE_FIRST_E2E_URL: '/gg/point-de-la-moye-east/i/39b9871d-071c-4520-b305-8ae57500be05?image=39b9871d-071c-4520-b305-8ae57500be05&route=9a90c2c3-afa1-4a8c-9ca8-77a3435a9b00&climb=0ea40c00-e4de-4b2d-b4ee-42de25261afb'
      PLAYWRIGHT_BASE_URL: 'https://letsboulder.com'
      PLAYWRIGHT_SKIP_GLOBAL_SETUP: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: 'npm'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Validate production-safe configuration
        run: |
          if [ "$PLAYWRIGHT_BASE_URL" != 'https://letsboulder.com' ]; then
            echo "::error::PLAYWRIGHT_BASE_URL must be https://letsboulder.com"
            exit 1
          fi

          forbidden_vars=(TEST_API_KEY TEST_USER_ID TEST_USER_EMAIL TEST_USER_PASSWORD TEST_AUTH_PATH_SEGMENT INTERNAL_TEST_KEY SUPABASE_SERVICE_ROLE_KEY DEV_SUPABASE_SERVICE_ROLE_KEY CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET)
          for var in "${forbidden_vars[@]}"; do
            if [ -n "${!var}" ]; then
              echo "::error::Forbidden environment variable present: $var"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Wait for production readiness
        run: |
          for i in $(seq 1 20); do
            status_code=$(curl -s -o /dev/null -w "%{http_code}" "$PLAYWRIGHT_BASE_URL/auth")
            if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 500 ]; then
              exit 0
            fi

            echo "Production not ready yet (HTTP $status_code), retry $i/20"
            sleep 6
          done

          echo "Production URL did not become ready in time: $PLAYWRIGHT_BASE_URL"
          exit 1

      - name: Run production-safe Playwright suite
        run: >-
          npx playwright test
          --retries=1
          --project=public
          tests/map.spec.ts
          tests/auth.spec.ts
          tests/auth-guards.spec.ts
          tests/settings.spec.ts
          tests/image-first.spec.ts

      - name: Upload Playwright production report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-production-nightly
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  production-mobile-runtime-audit:
    name: Production Mobile Runtime Audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      PLAYWRIGHT_BASE_URL: 'https://letsboulder.com'
      PLAYWRIGHT_SKIP_GLOBAL_SETUP: 'true'
      RUNTIME_AUDIT_RUN: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: 'npm'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-webkit-${{ hashFiles('package-lock.json') }}

      - name: Validate production-safe audit configuration
        run: |
          if [ "$PLAYWRIGHT_BASE_URL" != 'https://letsboulder.com' ]; then
            echo "::error::PLAYWRIGHT_BASE_URL must be https://letsboulder.com"
            exit 1
          fi

          forbidden_vars=(TEST_API_KEY TEST_USER_ID TEST_USER_EMAIL TEST_USER_PASSWORD TEST_AUTH_PATH_SEGMENT INTERNAL_TEST_KEY SUPABASE_SERVICE_ROLE_KEY DEV_SUPABASE_SERVICE_ROLE_KEY CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET)
          for var in "${forbidden_vars[@]}"; do
            if [ -n "${!var}" ]; then
              echo "::error::Forbidden environment variable present: $var"
              exit 1
            fi
          done

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium webkit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit

      - name: Wait for production readiness
        run: |
          for i in $(seq 1 20); do
            status_code=$(curl -s -o /dev/null -w "%{http_code}" "$PLAYWRIGHT_BASE_URL/auth")
            if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 500 ]; then
              exit 0
            fi

            echo "Production not ready yet (HTTP $status_code), retry $i/20"
            sleep 6
          done

          echo "Production URL did not become ready in time: $PLAYWRIGHT_BASE_URL"
          exit 1

      - name: Run deterministic mobile runtime audit
        run: >-
          npx playwright test
          --retries=1
          --project=mobile-chrome
          --project=mobile-safari
          tests/mobile-runtime-audit.spec.ts

      - name: Upload mobile runtime audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-mobile-runtime-audit-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
