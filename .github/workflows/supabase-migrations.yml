name: Supabase Migrations

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate-prod:
    name: Apply Supabase migrations (Production)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Detect migration count
        id: migration_count
        shell: bash
        run: |
          # Check for test migrations
          if ls supabase/migrations/*test*.sql supabase/migrations/*_test.sql 2>/dev/null | grep -q .; then
            echo "::error::Test migrations detected - remove before committing:"
            ls supabase/migrations/*test*.sql supabase/migrations/*_test.sql 2>/dev/null
            exit 1
          fi

          MIGRATION_COUNT=$(ls supabase/migrations/*.sql 2>/dev/null | wc -l)
          echo "Migration count: $MIGRATION_COUNT"
          echo "count=$MIGRATION_COUNT" >> "$GITHUB_OUTPUT"

          THRESHOLD=75
          SQUASH_THRESHOLD=150
          if [ "$MIGRATION_COUNT" -gt "$SQUASH_THRESHOLD" ]; then
            echo "migration_count_exceeded=squash_threshold_reached" >> "$GITHUB_OUTPUT"
          elif [ "$MIGRATION_COUNT" -gt "$THRESHOLD" ]; then
            echo "migration_count_exceeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "migration_count_exceeded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Migration count warning
        if: steps.migration_count.outputs.migration_count_exceeded == 'true'
        run: |
          echo "::warning::Migration count (${{ steps.migration_count.outputs.count }}) exceeds $THRESHOLD. Consider squashing migrations to reduce operational risk."

      - name: Migration squash required
        if: steps.migration_count.outputs.migration_count_exceeded == 'squash_threshold_reached'
        run: |
          echo "::error::Migration count (${{ steps.migration_count.outputs.count }}) exceeds $SQUASH_THRESHOLD. Squashing is required before merge."
          exit 1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Get database URL
        id: db_url
        run: |
          CONN_STR=$(supabase projects get "$SUPABASE_PROJECT_REF" --json | jq -r '.database.connection_string')
          echo "connection_string=$CONN_STR" >> "$GITHUB_OUTPUT"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Get applied migrations
        id: applied
        run: |
          DB_URL="${{ steps.db_url.outputs.connection_string }}"
          APPLIED=$(psql "$DB_URL" -t -c "SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;" 2>/dev/null | tr -d ' ' | tr '\n' ',' | sed 's/,$//')
          echo "applied=$APPLIED" >> "$GITHUB_OUTPUT"
          echo "Already applied: $APPLIED"

      - name: Find pending migrations
        id: pending
        shell: bash
        run: |
          cd supabase/migrations
          
          # Get applied versions as array
          APPLIED_STR="${{ steps.applied.outputs.applied }}"
          
          # Build associative array
          declare -A applied_map
          if [ -n "$APPLIED_STR" ]; then
            IFS=',' read -ra VERSIONS <<< "$APPLIED_STR"
            for v in "${VERSIONS[@]}"; do
              [ -n "$v" ] && applied_map["$v"]=1
            done
          fi
          
          # Find pending
          PENDING=""
          for f in *.sql; do
            version="${f%%_*}"
            if [ -z "${applied_map[$version]}" ]; then
              PENDING="$PENDING$f "
              echo "Will apply: $f"
            fi
          done
          
          echo "pending=$PENDING" >> "$GITHUB_OUTPUT"

      - name: Apply migrations
        shell: bash
        run: |
          cd supabase/migrations
          
          PENDING="${{ steps.pending.outputs.pending }}"
          
          if [ -z "$PENDING" ]; then
            echo "No pending migrations - already up to date"
            exit 0
          fi
          
          DB_URL="${{ steps.db_url.outputs.connection_string }}"
          FAILED=""
          
          for f in $PENDING; do
            echo "Applying: $f"
            if psql "$DB_URL" -f "$f" 2>&1; then
              version="${f%%_*}"
              psql "$DB_URL" -c "INSERT INTO supabase_migrations.schema_migrations (version) VALUES ('$version') ON CONFLICT DO NOTHING;" 2>/dev/null
              echo "Success: $f"
            else
              FAILED="$FAILED $f"
              echo "::error::Failed: $f"
            fi
          done
          
          if [ -n "$FAILED" ]; then
            echo "::error::Failed migrations:$FAILED"
            exit 0
          fi
          
          echo "All migrations applied successfully"

  migrate-dev:
    name: Apply Supabase migrations (Development)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Detect migration count
        id: migration_count
        shell: bash
        run: |
          # Check for test migrations
          if ls supabase/migrations/*test*.sql supabase/migrations/*_test.sql 2>/dev/null | grep -q .; then
            echo "::error::Test migrations detected - remove before committing:"
            ls supabase/migrations/*test*.sql supabase/migrations/*_test.sql 2>/dev/null
            exit 1
          fi

          MIGRATION_COUNT=$(ls supabase/migrations/*.sql 2>/dev/null | wc -l)
          echo "Migration count: $MIGRATION_COUNT"
          echo "count=$MIGRATION_COUNT" >> "$GITHUB_OUTPUT"

          THRESHOLD=75
          SQUASH_THRESHOLD=150
          if [ "$MIGRATION_COUNT" -gt "$SQUASH_THRESHOLD" ]; then
            echo "migration_count_exceeded=squash_threshold_reached" >> "$GITHUB_OUTPUT"
          elif [ "$MIGRATION_COUNT" -gt "$THRESHOLD" ]; then
            echo "migration_count_exceeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "migration_count_exceeded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Migration count warning
        if: steps.migration_count.outputs.migration_count_exceeded == 'true'
        run: |
          echo "::warning::Migration count (${{ steps.migration_count.outputs.count }}) exceeds $THRESHOLD. Consider squashing migrations to reduce operational risk."

      - name: Migration squash required
        if: steps.migration_count.outputs.migration_count_exceeded == 'squash_threshold_reached'
        run: |
          echo "::error::Migration count (${{ steps.migration_count.outputs.count }}) exceeds $SQUASH_THRESHOLD. Squashing is required before merge."
          exit 1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Link dev project
        run: supabase link --project-ref "$SUPABASE_DEV_PROJECT_REF" --password "$SUPABASE_DEV_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
