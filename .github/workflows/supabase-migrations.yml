name: Supabase Migrations

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate-prod:
    name: Apply Supabase migrations (Production)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Detect migration count
        id: migration_count
        shell: bash
        run: |
          # Check for test migrations
          if ls supabase/migrations/*test*.sql supabase/migrations/*_test.sql 2>/dev/null | grep -q .; then
            echo "::error::Test migrations detected - remove before committing:"
            ls supabase/migrations/*test*.sql supabase/migrations/*_test.sql 2>/dev/null
            exit 1
          fi

          MIGRATION_COUNT=$(ls supabase/migrations/*.sql 2>/dev/null | wc -l)
          echo "Migration count: $MIGRATION_COUNT"
          echo "count=$MIGRATION_COUNT" >> "$GITHUB_OUTPUT"

          THRESHOLD=75
          SQUASH_THRESHOLD=125
          if [ "$MIGRATION_COUNT" -gt "$SQUASH_THRESHOLD" ]; then
            echo "migration_count_exceeded=squash_threshold_reached" >> "$GITHUB_OUTPUT"
          elif [ "$MIGRATION_COUNT" -gt "$THRESHOLD" ]; then
            echo "migration_count_exceeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "migration_count_exceeded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Migration count warning
        if: steps.migration_count.outputs.migration_count_exceeded == 'true'
        run: |
          echo "::warning::Migration count (${{ steps.migration_count.outputs.count }}) exceeds $THRESHOLD. Consider squashing migrations to reduce operational risk."

      - name: Migration squash required
        if: steps.migration_count.outputs.migration_count_exceeded == 'squash_threshold_reached'
        run: |
          echo "::error::Migration count (${{ steps.migration_count.outputs.count }}) exceeds $SQUASH_THRESHOLD. Squashing is required before merge."
          exit 1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Repair migration history
        run: |
          # Mark old migration versions as applied since schema already exists
          supabase migration repair --status applied \
            20260110180000 20260111000000 20260113120000 20260114000001 \
            20260115000000 20260115000002 20260119000000 20260120000000 \
            20260120000002 20260120000003 20260121074609 20260121080000 \
            20260122000000 20260122163838 20260123000000 20260123000002 \
            20260123174919 20260125000000 20260125000001 20260125000002 \
            20260126000000 20260127000000 20260130000000 20260130000001 \
            20260201000000 20260201000001 20260202000000 20260202090000 \
            20260203000000 20260205000000 20260205000001 20260205000002 \
            20260205000003 20260205000004 20260205000005 20260206000000 \
            20260206000001 20260207000000 20260207000001 20260208000000 \
            20260208143000 20260209000000 20260210000000 20260215000000 \
            20260216000000 20260217000000 20260218000000 20260219000000 \
            20260220000000 20260221000000 20260222000000 20260223000000 \
            20260224000000 20260225000000 20260226000000 20260228000000 \
            20260228000001 20260301000000 20260302000000 20260302000012 \
            20260302161000 20260303000000 20260303000001 20260306000000 \
            20260306010000 20260306020000 20260307000000 20260307010000 \
            20260308000000 20260309000000 20260309010000 20260310000000 \
            20260311000000 20260312000000 20260313000000 20260314000000 \
            20260315000000 20260315000046 20260315000400 20260316000000 \
            20260316000001 20260316000002 20260316000003 20260316000004 \
            20260316010000 20260317000000 20260317000001 20260317000005 \
            20260317000006 20260317010000 20260317020000 20260318000000 \
            20260318010000 20260318020000 20260318030000 20260319010000 \
            20260320000000 20260325000000 20260326000000 20260326010000 \
            20260326010001 || true
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Apply migrations
        run: supabase db push --linked --include-all --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  migrate-dev:
    name: Apply Supabase migrations (Development)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Detect migration count
        id: migration_count
        shell: bash
        run: |
          # Check for test migrations
          if ls supabase/migrations/*test*.sql supabase/migrations/*_test.sql 2>/dev/null | grep -q .; then
            echo "::error::Test migrations detected - remove before committing:"
            ls supabase/migrations/*test*.sql supabase/migrations/*_test.sql 2>/dev/null
            exit 1
          fi

          MIGRATION_COUNT=$(ls supabase/migrations/*.sql 2>/dev/null | wc -l)
          echo "Migration count: $MIGRATION_COUNT"
          echo "count=$MIGRATION_COUNT" >> "$GITHUB_OUTPUT"

          THRESHOLD=75
          SQUASH_THRESHOLD=125
          if [ "$MIGRATION_COUNT" -gt "$SQUASH_THRESHOLD" ]; then
            echo "migration_count_exceeded=squash_threshold_reached" >> "$GITHUB_OUTPUT"
          elif [ "$MIGRATION_COUNT" -gt "$THRESHOLD" ]; then
            echo "migration_count_exceeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "migration_count_exceeded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Migration count warning
        if: steps.migration_count.outputs.migration_count_exceeded == 'true'
        run: |
          echo "::warning::Migration count (${{ steps.migration_count.outputs.count }}) exceeds $THRESHOLD. Consider squashing migrations to reduce operational risk."

      - name: Migration squash required
        if: steps.migration_count.outputs.migration_count_exceeded == 'squash_threshold_reached'
        run: |
          echo "::error::Migration count (${{ steps.migration_count.outputs.count }}) exceeds $SQUASH_THRESHOLD. Squashing is required before merge."
          exit 1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Link dev project and apply migrations
        run: |
          supabase link --project-ref "$SUPABASE_DEV_PROJECT_REF" --password "$SUPABASE_DEV_DB_PASSWORD"
          supabase migration repair --status applied \
            20260110180000 20260111000000 20260113120000 20260114000001 \
            20260115000000 20260115000002 20260119000000 20260120000000 \
            20260120000002 20260120000003 20260121074609 20260121080000 \
            20260122000000 20260122163838 20260123000000 20260123000002 \
            20260123174919 20260125000000 20260125000001 20260125000002 \
            20260126000000 20260127000000 20260130000000 20260130000001 \
            20260201000000 20260201000001 20260202000000 20260202090000 \
            20260203000000 20260205000000 20260205000001 20260205000002 \
            20260205000003 20260205000004 20260205000005 20260206000000 \
            20260206000001 20260207000000 20260207000001 20260208000000 \
            20260208143000 20260209000000 20260210000000 20260215000000 \
            20260216000000 20260217000000 20260218000000 20260219000000 \
            20260220000000 20260221000000 20260222000000 20260223000000 \
            20260224000000 20260225000000 20260226000000 20260228000000 \
            20260228000001 20260301000000 20260302000000 20260302000012 \
            20260302161000 20260303000000 20260303000001 20260306000000 \
            20260306010000 20260306020000 20260307000000 20260307010000 \
            20260308000000 20260309000000 20260309010000 20260310000000 \
            20260311000000 20260312000000 20260313000000 20260314000000 \
            20260315000000 20260315000046 20260315000400 20260316000000 \
            20260316000001 20260316000002 20260316000003 20260316000004 \
            20260316010000 20260317000000 20260317000001 20260317000005 \
            20260317000006 20260317010000 20260317020000 20260318000000 \
            20260318010000 20260318020000 20260318030000 20260319010000 \
            20260320000000 20260325000000 20260326000000 20260326010000 \
            20260326010001 || true
          supabase db push --linked --include-all --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
          SUPABASE_DEV_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
