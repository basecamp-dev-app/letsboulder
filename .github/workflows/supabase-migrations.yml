name: Supabase Migrations

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Current main commit SHA to validate and apply'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-migrations-production
  cancel-in-progress: false

jobs:
  migrate-prod:
    name: Validate Supabase migrations (Production)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Verify selected commit is current main
        if: github.event_name == 'workflow_dispatch'
        env:
          SELECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SELECTED_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::commit_sha must be a full 40-character commit SHA.'
            exit 1
          fi
          git fetch origin main --quiet
          MAIN_SHA=$(git rev-parse origin/main)
          if [[ "$SELECTED_COMMIT_SHA" != "$MAIN_SHA" ]]; then
            echo "::error::Selected commit is not the current main commit ($MAIN_SHA)."
            exit 1
          fi

      - name: Install migration tooling
        run: |
          if ! command -v jq >/dev/null 2>&1 || ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y jq postgresql-client
          fi

      - name: Detect migration count
        id: migration_count
        shell: bash
        env:
          THRESHOLD: '75'
          SQUASH_THRESHOLD: '250'
        run: |
          # Check for test migrations
          if ls supabase/migrations/*test*.sql supabase/migrations/*_test.sql 2>/dev/null | grep -q .; then
            echo "::error::Test migrations detected - remove before committing:"
            ls supabase/migrations/*test*.sql supabase/migrations/*_test.sql 2>/dev/null
            exit 1
          fi

          MIGRATION_COUNT=$(ls supabase/migrations/*.sql 2>/dev/null | wc -l)
          echo "Migration count: $MIGRATION_COUNT"
          echo "count=$MIGRATION_COUNT" >> "$GITHUB_OUTPUT"

          THRESHOLD=75
          SQUASH_THRESHOLD=250
          if [ "$MIGRATION_COUNT" -gt "$SQUASH_THRESHOLD" ]; then
            echo "migration_count_exceeded=squash_threshold_reached" >> "$GITHUB_OUTPUT"
          elif [ "$MIGRATION_COUNT" -gt "$THRESHOLD" ]; then
            echo "migration_count_exceeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "migration_count_exceeded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Migration count warning
        if: steps.migration_count.outputs.migration_count_exceeded == 'true'
        env:
          THRESHOLD: '75'
        run: |
          echo "::warning::Migration count (${{ steps.migration_count.outputs.count }}) exceeds $THRESHOLD. Consider squashing migrations to reduce operational risk."

      - name: Migration squash required
        if: steps.migration_count.outputs.migration_count_exceeded == 'squash_threshold_reached'
        env:
          SQUASH_THRESHOLD: '250'
        run: |
          echo "::error::Migration count (${{ steps.migration_count.outputs.count }}) exceeds $SQUASH_THRESHOLD. Squashing is required before merge."
          exit 1

      - name: Link Supabase project
        run: npx --no-install supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Preview migrations
        run: timeout 15m npx --no-install supabase db push --linked --include-all --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Verify selected commit is still current main
        if: github.event_name == 'workflow_dispatch'
        env:
          SELECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          MAIN_SHA=$(git rev-parse origin/main)
          if [[ "$SELECTED_COMMIT_SHA" != "$MAIN_SHA" ]]; then
            echo "::error::Main changed during validation ($MAIN_SHA); run the dry-run again."
            exit 1
          fi

      - name: Apply migrations
        if: github.event_name == 'workflow_dispatch'
        run: timeout 15m npx --no-install supabase db push --linked --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
