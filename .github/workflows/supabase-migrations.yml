name: Supabase Migrations

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate-prod:
    name: Apply Supabase migrations (Production)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Detect migration count
        id: migration_count
        shell: bash
        run: |
          # Check for test migrations
          if ls supabase/migrations/*test*.sql supabase/migrations/*_test.sql 2>/dev/null | grep -q .; then
            echo "::error::Test migrations detected - remove before committing:"
            ls supabase/migrations/*test*.sql supabase/migrations/*_test.sql 2>/dev/null
            exit 1
          fi

          MIGRATION_COUNT=$(ls supabase/migrations/*.sql 2>/dev/null | wc -l)
          echo "Migration count: $MIGRATION_COUNT"
          echo "count=$MIGRATION_COUNT" >> "$GITHUB_OUTPUT"

          THRESHOLD=75
          SQUASH_THRESHOLD=125
          if [ "$MIGRATION_COUNT" -gt "$SQUASH_THRESHOLD" ]; then
            echo "migration_count_exceeded=squash_threshold_reached" >> "$GITHUB_OUTPUT"
          elif [ "$MIGRATION_COUNT" -gt "$THRESHOLD" ]; then
            echo "migration_count_exceeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "migration_count_exceeded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Migration count warning
        if: steps.migration_count.outputs.migration_count_exceeded == 'true'
        run: |
          echo "::warning::Migration count (${{ steps.migration_count.outputs.count }}) exceeds $THRESHOLD. Consider squashing migrations to reduce operational risk."

      - name: Migration squash required
        if: steps.migration_count.outputs.migration_count_exceeded == 'squash_threshold_reached'
        run: |
          echo "::error::Migration count (${{ steps.migration_count.outputs.count }}) exceeds $SQUASH_THRESHOLD. Squashing is required before merge."
          exit 1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Apply migrations
        run: supabase db push --linked --include-all --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  migrate-dev:
    name: Apply Supabase migrations (Development)
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    environment: Development
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Detect migration count
        id: migration_count
        shell: bash
        run: |
          # Check for test migrations
          if ls supabase/migrations/*test*.sql supabase/migrations/*_test.sql 2>/dev/null | grep -q .; then
            echo "::error::Test migrations detected - remove before committing:"
            ls supabase/migrations/*test*.sql supabase/migrations/*_test.sql 2>/dev/null
            exit 1
          fi

          MIGRATION_COUNT=$(ls supabase/migrations/*.sql 2>/dev/null | wc -l)
          echo "Migration count: $MIGRATION_COUNT"
          echo "count=$MIGRATION_COUNT" >> "$GITHUB_OUTPUT"

          THRESHOLD=75
          SQUASH_THRESHOLD=125
          if [ "$MIGRATION_COUNT" -gt "$SQUASH_THRESHOLD" ]; then
            echo "migration_count_exceeded=squash_threshold_reached" >> "$GITHUB_OUTPUT"
          elif [ "$MIGRATION_COUNT" -gt "$THRESHOLD" ]; then
            echo "migration_count_exceeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "migration_count_exceeded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Migration count warning
        if: steps.migration_count.outputs.migration_count_exceeded == 'true'
        run: |
          echo "::warning::Migration count (${{ steps.migration_count.outputs.count }}) exceeds $THRESHOLD. Consider squashing migrations to reduce operational risk."

      - name: Migration squash required
        if: steps.migration_count.outputs.migration_count_exceeded == 'squash_threshold_reached'
        run: |
          echo "::error::Migration count (${{ steps.migration_count.outputs.count }}) exceeds $SQUASH_THRESHOLD. Squashing is required before merge."
          exit 1

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Sync dev schema from prod
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db pull --linked --schema public --skip-migration-history
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

      - name: Link dev project and apply migrations
        run: |
          supabase link --project-ref "$SUPABASE_DEV_PROJECT_REF" --password "$SUPABASE_DEV_DB_PASSWORD"
          supabase db push --linked --include-all --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DEV_PROJECT_REF: ${{ secrets.SUPABASE_DEV_PROJECT_REF }}
          SUPABASE_DEV_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
