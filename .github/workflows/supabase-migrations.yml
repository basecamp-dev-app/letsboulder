name: Supabase Migrations

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'Production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Revert orphaned migration versions
        run: |
          # These migration files were applied manually via SQL Editor and
          # then removed from the repo because the Supabase CLI cannot parse
          # PL/pgSQL function bodies. Revert them in the remote history so
          # db push doesn't fail with "versions not found locally".
          supabase migration repair --status reverted 20260345000001 --linked
          supabase migration repair --status reverted 20260345000003 --linked
          supabase migration repair --status reverted 20260345000004 --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply migrations
        run: supabase db push --linked --include-all --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

  drift-check:
    name: Check schema drift
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Check for schema drift
        run: |
          DIFF=$(supabase db diff --linked --use-migra 2>&1)
          if [ -n "$DIFF" ]; then
            echo "::warning::Schema drift detected between migrations and prod:"
            echo "$DIFF"
            exit 1
          else
            echo "No schema drift detected."
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
