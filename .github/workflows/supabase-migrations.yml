name: Supabase Migrations

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Supabase migrations
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        (
          github.event.workflow_run.head_branch == 'dev' ||
          github.event.workflow_run.head_branch == 'main'
        )
      )
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_dispatch' && github.ref_name == 'main') || github.event.workflow_run.head_branch == 'main' && 'Production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Detect migration changes
        id: migration_changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only HEAD^ HEAD -- 'supabase/migrations/**' '.github/workflows/supabase-migrations.yml' | grep -q .; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.migration_changes.outputs.changed == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.84.2

      - name: Link Supabase project
        if: steps.migration_changes.outputs.changed == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

      - name: Apply migrations
        if: steps.migration_changes.outputs.changed == 'true'
        run: supabase db push --linked --include-all --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Skip when no migration changes
        if: steps.migration_changes.outputs.changed != 'true'
        run: |
          echo 'No migration-related changes in the successful push workflow.'
          echo 'Skipping Supabase migration apply.'
