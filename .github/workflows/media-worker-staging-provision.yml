name: Media Worker Provision (Staging)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision-staging:
    name: Provision Staging Media Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: npm
          cache-dependency-path: apps/media-worker/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/media-worker

      - name: Ensure staging R2 buckets and queue exist
        working-directory: apps/media-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          if npx --no-install wrangler r2 bucket list | grep -Fq 'lb-staging-media-private'; then
            echo 'lb-staging-media-private already exists'
          else
            npx --no-install wrangler r2 bucket create lb-staging-media-private
          fi

          if npx --no-install wrangler r2 bucket list | grep -Fq 'lb-staging-media-public'; then
            echo 'lb-staging-media-public already exists'
          else
            npx --no-install wrangler r2 bucket create lb-staging-media-public
          fi

          if npx --no-install wrangler queues list | grep -Fq 'media-transform-queue-staging'; then
            echo 'media-transform-queue-staging already exists'
          else
            npx --no-install wrangler queues create media-transform-queue-staging
          fi
