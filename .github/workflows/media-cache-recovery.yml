name: Production Media Cache Recovery

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PURGE_MEDIA_CACHE exactly to purge the letsboulder.com edge cache
        required: true
        type: string

permissions:
  contents: read

jobs:
  purge:
    name: Purge production edge cache
    runs-on: ubuntu-latest
    environment: Production
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Purge Cloudflare edge cache
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRMATION" != 'PURGE_MEDIA_CACHE' ]; then
            echo '::error::Confirmation must exactly equal PURGE_MEDIA_CACHE'
            exit 1
          fi
          account_id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || ! [[ "$account_id" =~ ^[0-9a-f]{32}$ ]]; then
            echo '::error::Missing or invalid Cloudflare configuration'
            exit 1
          fi
          zones="$(curl --fail --silent --show-error --get \
            'https://api.cloudflare.com/client/v4/zones' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --data-urlencode 'name=letsboulder.com' \
            --data-urlencode "account.id=$account_id")"
          if ! jq -e '.success == true and (.result | length) == 1' <<< "$zones" >/dev/null; then
            echo '::error::Could not identify the letsboulder.com zone uniquely'
            exit 1
          fi
          zone_id="$(jq -r '.result[0].id' <<< "$zones")"
          result="$(curl --fail --silent --show-error --request POST \
            "https://api.cloudflare.com/client/v4/zones/$zone_id/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"purge_everything":true}')"
          if ! jq -e '.success == true' <<< "$result" >/dev/null; then
            echo '::error::Cloudflare cache purge was rejected'
            exit 1
          fi
          echo 'Cloudflare edge cache purge completed'
