name: Refresh media worker security dependencies

on:
  push:
    branches:
      - fix/automate-production-release
    paths:
      - '.github/workflows/refresh-media-worker-security-deps.yml'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/automate-production-release

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Pin patched Sharp in media worker graph
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'apps/media-worker/package.json'
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'))
          pkg.overrides = { ...(pkg.overrides || {}), sharp: '^0.35.4' }
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE

      - name: Refresh media worker lockfile
        run: npm --prefix apps/media-worker install --package-lock-only --ignore-scripts

      - name: Verify media worker audit
        run: npm --prefix apps/media-worker audit --audit-level=low

      - name: Commit dependency refresh
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/media-worker/package.json apps/media-worker/package-lock.json
          if git diff --cached --quiet; then
            echo 'No media worker dependency changes to commit.'
            exit 0
          fi
          git commit -m 'chore: patch media worker security dependency'
          git push origin HEAD:fix/automate-production-release
