name: CI

on:
  deployment_status:
    branches: [main, dev]
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      playwright_base_url:
        description: "Trusted deployment origin (normally https://dev.letsboulder.com)"
        required: false
        type: string
      vercel_deployment_id:
        description: "Vercel deployment ID to resolve through the Vercel API"
        required: false
        type: string
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read
  statuses: read
  pull-requests: read

jobs:
  quality-checks:
    name: Quality Checks
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Lint
        run: npm run lint

      - name: Check feature structure
        run: npm run check:features

      - name: Verify docs drift
        run: bash docs/verify.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Check type drift
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MIGRATIONS_CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} -- supabase/migrations/ | wc -l)
            TYPES_CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} -- types/database.ts | wc -l)
            if [ "$MIGRATIONS_CHANGED" -gt 0 ] && [ "$TYPES_CHANGED" -eq 0 ]; then
              echo "::error::Migrations were changed but types/database.ts was not regenerated. Run 'supabase gen types typescript --local > types/database.ts' and commit the result."
              exit 1
            fi
            echo "Type drift check passed (migrations: $MIGRATIONS_CHANGED changed, types: $TYPES_CHANGED changed)"
          else
            echo "Skipping type drift check (not a pull_request event)"
          fi

  build:
    name: Next.js Build
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Validate build environment
        run: |
          required_vars=(NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY)
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required build environment variable: $var"
              exit 1
            fi
          done
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ github.event_name == 'pull_request' && 'https://example.supabase.co' || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ github.event_name == 'pull_request' && 'anon-test-key' || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ github.event_name == 'pull_request' && 'https://example.supabase.co' || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ github.event_name == 'pull_request' && 'anon-test-key' || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  tests:
    name: ${{ matrix.name }}
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: unit
            name: Unit Tests
            command: npm run test:unit
          - id: component
            name: Component Tests
            command: npm run test:components
          - id: integration
            name: Integration Tests
            command: npm run test:integration:coverage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Upload ${{ matrix.name }} artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-test-artifacts
          path: |
            coverage
            test-results
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy to Vercel
    needs: [quality-checks, build, tests, media-worker-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel Deployment
        run: |
          echo "Triggering Vercel deployment via Deploy Hook..."
          response=$(curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}")
          echo "Response: $response"

          # Check if response contains a valid Vercel job
          if echo "$response" | grep -q '"state":"PENDING"'; then
            echo "Vercel deployment triggered successfully"
          else
            echo "::error::Failed to trigger Vercel deployment: $response"
            exit 1
          fi
          echo "Vercel deployment triggered successfully"

  media-worker-check:
    name: Media Worker Check
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: "npm"
          cache-dependency-path: apps/media-worker/package-lock.json

      - name: Install dependencies
        run: npm --prefix apps/media-worker ci --prefer-offline

      - name: Typecheck media worker
        run: npm --prefix apps/media-worker run check

  smoke:
    name: E2E Smoke
    if: |
      (
        github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        (
          github.event.deployment.ref == 'main' ||
          github.event.deployment.ref == 'dev'
        )
      ) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: "npm"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit

      - name: Resolve trusted Playwright base URL
        id: resolve_base_url
        run: npx tsx scripts/playwright/deployment-url.ts
        env:
          PLAYWRIGHT_REQUESTED_BASE_URL: ${{ github.event_name == 'deployment_status' && github.event.deployment_status.target_url || github.event.inputs.playwright_base_url || '' }}
          VERCEL_DEPLOYMENT_ID: ${{ github.event.inputs.vercel_deployment_id || '' }}
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Wait for preview readiness
        run: |
          for i in $(seq 1 20); do
            status_code=$(curl --fail-with-body --silent --show-error --output /dev/null --write-out "%{http_code}" "$PLAYWRIGHT_BASE_URL/auth" || true)
            if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 500 ]; then
              exit 0
            fi

            echo "Preview not ready yet (HTTP $status_code), retry $i/20"
            sleep 6
          done

          echo "Preview URL did not become ready in time: $PLAYWRIGHT_BASE_URL"
          exit 1
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.resolve_base_url.outputs.base_url }}

      - name: Run public Playwright smoke suite
        run: npx playwright test --project=public --grep @smoke --retries=1
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.resolve_base_url.outputs.base_url }}
          VERCEL_DEPLOYMENT_ID: ${{ github.event.inputs.vercel_deployment_id || '' }}
          CI: true

      - name: Validate authenticated smoke configuration
        run: |
          required_vars=(TEST_API_KEY TEST_AUTH_PATH_SEGMENT TEST_USER_PASSWORD DEV_SUPABASE_SERVICE_ROLE_KEY)
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required authenticated smoke environment variable: $var"
              exit 1
            fi
          done
          if [ -z "$TEST_USER_ID" ] && [ -z "$TEST_USER_EMAIL" ]; then
            echo "::error::Either TEST_USER_ID or TEST_USER_EMAIL is required for authenticated smoke tests"
            exit 1
          fi
        env:
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
          TEST_AUTH_PATH_SEGMENT: ${{ secrets.TEST_AUTH_PATH_SEGMENT }}
          TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          DEV_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run authenticated Playwright smoke suite
        run: npx playwright test --project=authenticated --grep @smoke --retries=1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DEV_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
          TEST_AUTH_PATH_SEGMENT: ${{ secrets.TEST_AUTH_PATH_SEGMENT }}
          TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          INTERNAL_TEST_KEY: ${{ secrets.INTERNAL_TEST_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PLAYWRIGHT_BASE_URL: ${{ steps.resolve_base_url.outputs.base_url }}
          VERCEL_DEPLOYMENT_ID: ${{ github.event.inputs.vercel_deployment_id || '' }}
          CI: true
          ENABLE_TEST_AUTH_ENDPOINT: 'true'

      - name: Upload Playwright smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
