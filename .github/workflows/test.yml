name: CI

on:
  deployment_status:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      playwright_base_url:
        description: "Trusted public deployment origin (https://letsboulder.com)"
        required: false
        type: string
      vercel_deployment_id:
        description: "Vercel deployment ID to resolve through the Vercel API"
        required: false
        type: string
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-checks:
    name: Quality Checks
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            apps/media-worker/package-lock.json

      - name: Install root dependencies
        run: npm ci --prefer-offline

      - name: Install media worker dependencies
        run: npm --prefix apps/media-worker ci --prefer-offline

      - name: Lint
        run: npm run lint

      - name: Report feature layout (advisory)
        run: npm run check:features

      - name: Check architecture boundaries
        run: npm run check:architecture

      - name: Verify docs drift
        run: bash docs/verify.sh

      - name: Typecheck
        run: npm run typecheck

  generated-type-drift:
    name: Generated Database Type Drift
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Start local Supabase
        run: npx --no-install supabase start

      - name: Reset local database
        run: npx --no-install supabase db reset

      - name: Check generated database types
        run: npm run check:type-drift

      - name: Run database tests
        run: npm run test:database

      - name: Stop local Supabase
        if: always()
        run: npx --no-install supabase stop || true

  build:
    name: Next.js Build
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Validate build environment
        run: |
          required_vars=(NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY)
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required build environment variable: $var"
              exit 1
            fi
          done
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-test-key

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: anon-test-key

  tests:
    name: ${{ matrix.name }}
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: unit
            name: Unit Tests
            command: npm run test:unit
          - id: component
            name: Component Tests
            command: npm run test:components
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Upload ${{ matrix.name }} artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.id }}-test-artifacts
          path: |
            coverage
            test-results
          if-no-files-found: ignore
          retention-days: 7

  media-worker-check:
    name: Media Worker Check
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: "npm"
          cache-dependency-path: apps/media-worker/package-lock.json

      - name: Install dependencies
        run: npm --prefix apps/media-worker ci --prefer-offline

      - name: Typecheck media worker
        run: npm --prefix apps/media-worker run check

  smoke:
    name: E2E Smoke
    if: |
      (
        github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        github.event.deployment.ref == 'main' &&
        github.event.deployment.environment == 'Production'
      ) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: Production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: "npm"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit

      - name: Resolve trusted Playwright base URL
        id: resolve_base_url
        run: npx tsx scripts/playwright/deployment-url.ts
        env:
          PLAYWRIGHT_REQUESTED_BASE_URL: ${{ github.event_name == 'deployment_status' && 'https://letsboulder.com' || inputs.playwright_base_url || '' }}
          VERCEL_DEPLOYMENT_ID: ${{ inputs.vercel_deployment_id || '' }}
          VERCEL_API_TOKEN: ${{ github.event_name == 'workflow_dispatch' && secrets.VERCEL_API_TOKEN || '' }}
          VERCEL_PROJECT_ID: ${{ github.event_name == 'workflow_dispatch' && vars.VERCEL_PROJECT_ID || '' }}

      - name: Wait for target readiness
        run: |
          for i in $(seq 1 20); do
            status_code=$(curl --fail-with-body --silent --show-error --output /dev/null --write-out "%{http_code}" "$PLAYWRIGHT_BASE_URL/auth" || true)
            if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 500 ]; then
              exit 0
            fi

            echo "Target not ready yet (HTTP $status_code), retry $i/20"
            sleep 6
          done

          echo "Target URL did not become ready in time: $PLAYWRIGHT_BASE_URL"
          exit 1
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.resolve_base_url.outputs.base_url }}

      - name: Run public Playwright smoke suite
        run: npx playwright test --project=public --grep @smoke --retries=1
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.resolve_base_url.outputs.base_url }}
          VERCEL_DEPLOYMENT_ID: ${{ inputs.vercel_deployment_id || '' }}
          CI: true

      - name: Validate authenticated smoke configuration
        if: steps.resolve_base_url.outputs.authenticated_allowed == 'true'
        run: |
          required_vars=(TEST_API_KEY TEST_AUTH_PATH_SEGMENT TEST_USER_PASSWORD DEV_SUPABASE_SERVICE_ROLE_KEY)
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing required authenticated smoke environment variable: $var"
              exit 1
            fi
          done
          if [ -z "$TEST_USER_ID" ] && [ -z "$TEST_USER_EMAIL" ]; then
            echo "::error::Either TEST_USER_ID or TEST_USER_EMAIL is required for authenticated smoke tests"
            exit 1
          fi
        env:
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
          TEST_AUTH_PATH_SEGMENT: ${{ secrets.TEST_AUTH_PATH_SEGMENT }}
          TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          DEV_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run authenticated Playwright smoke suite
        if: steps.resolve_base_url.outputs.authenticated_allowed == 'true'
        run: npx playwright test --project=authenticated --grep @smoke --retries=1
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          DEV_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
          TEST_AUTH_PATH_SEGMENT: ${{ secrets.TEST_AUTH_PATH_SEGMENT }}
          TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          INTERNAL_TEST_KEY: ${{ secrets.INTERNAL_TEST_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PLAYWRIGHT_BASE_URL: ${{ steps.resolve_base_url.outputs.base_url }}
          VERCEL_DEPLOYMENT_ID: ${{ inputs.vercel_deployment_id || '' }}
          CI: true
          ENABLE_TEST_AUTH_ENDPOINT: 'true'
          PLAYWRIGHT_AUTHENTICATED_SMOKE: 'true'

      - name: Skip authenticated Playwright smoke suite on remote target
        if: steps.resolve_base_url.outputs.authenticated_allowed != 'true'
        run: echo 'Skipping authenticated smoke tests because the target is not an allowlisted protected hostname.'

      - name: Upload Playwright smoke report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-smoke
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
