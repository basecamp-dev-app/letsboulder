name: CI

on:
  push:
    branches: [main, dev]
  deployment_status:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      playwright_base_url:
        description: "Optional base URL override for Playwright runs"
        required: false
        type: string
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  deployments: read
  statuses: read
  pull-requests: read

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: "npm"

      - name: Install dependencies
        run: npm install --prefer-offline

      - name: Lint
        run: npm run lint

      - name: Check feature structure
        run: npm run check:features

      - name: Verify docs drift
        run: bash docs/verify.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Component Tests
        run: npm run test:components

      - name: Run Integration Tests
        run: npm run test:integration:coverage

      - name: Check type drift
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MIGRATIONS_CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} -- supabase/migrations/ | wc -l)
            TYPES_CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} -- types/database.ts | wc -l)
            if [ "$MIGRATIONS_CHANGED" -gt 0 ] && [ "$TYPES_CHANGED" -eq 0 ]; then
              echo "::error::Migrations were changed but types/database.ts was not regenerated. Run 'supabase gen types typescript --local > types/database.ts' and commit the result."
              exit 1
            fi
            echo "Type drift check passed (migrations: $MIGRATIONS_CHANGED changed, types: $TYPES_CHANGED changed)"
          else
            echo "Skipping type drift check (not a pull_request event)"
          fi

  media-worker:
    name: Media Worker Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: "npm"

      - name: Install dependencies
        run: npm install --prefer-offline

      - name: Typecheck media worker
        run: npm --prefix apps/media-worker run check

  smoke:
    name: E2E Smoke
    if: |
      github.event_name != 'schedule' &&
      (
        github.event_name != 'deployment_status' ||
        (
          github.event.deployment_status.state == 'success' &&
          github.event.deployment.ref == 'dev'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: "npm"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm install --prefer-offline

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Resolve Playwright base URL
        id: resolve_base_url
        uses: actions/github-script@v7
        with:
          script: |
            const manualBaseUrl = '${{ github.event.inputs.playwright_base_url || '' }}'.trim();
            if (manualBaseUrl) {
              core.info(`Using manual base URL: ${manualBaseUrl}`);
              core.setOutput('base_url', manualBaseUrl);
              return;
            }

            if (context.eventName === 'deployment_status') {
              const targetUrl = context.payload.deployment_status?.target_url || '';
              if (!targetUrl) {
                core.setFailed('Deployment status event is missing target_url.');
                return;
              }
              core.info(`Using deployment target URL: ${targetUrl}`);
              core.setOutput('base_url', targetUrl);
              return;
            }

            if (context.eventName === 'pull_request') {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const sha = context.payload.pull_request.head.sha;
              const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

              for (let attempt = 1; attempt <= 30; attempt++) {
                core.info(`Attempt ${attempt}/30: looking up Vercel deployment for ${sha}`);
                const deployments = await github.paginate(github.rest.repos.listDeployments, {
                  owner,
                  repo,
                  sha,
                  per_page: 100,
                });

                for (const deployment of deployments) {
                  const statuses = await github.paginate(github.rest.repos.listDeploymentStatuses, {
                    owner,
                    repo,
                    deployment_id: deployment.id,
                    per_page: 100,
                  });

                  const successStatus = statuses.find((status) => {
                    if (status.state !== 'success') return false;
                    const targetUrl = status.target_url || '';
                    return /https:\/\/[a-z0-9-]+\.vercel\.app/i.test(targetUrl);
                  });

                  if (successStatus?.target_url) {
                    core.info(`Resolved preview URL: ${successStatus.target_url}`);
                    core.setOutput('base_url', successStatus.target_url);
                    return;
                  }
                }

                await sleep(20000);
              }

              core.setFailed('Timed out waiting for successful Vercel preview deployment URL.');
              return;
            }

            const fallbackBaseUrl = process.env.PLAYWRIGHT_BASE_URL || 'https://dev.letsboulder.com';
            core.info(`Using fallback base URL: ${fallbackBaseUrl}`);
            core.setOutput('base_url', fallbackBaseUrl);

      - name: Wait for preview readiness
        run: |
          base_url='${{ steps.resolve_base_url.outputs.base_url }}'
          if [ -z "$base_url" ]; then
            echo "Failed to resolve PLAYWRIGHT_BASE_URL"
            exit 1
          fi

          for i in $(seq 1 20); do
            status_code=$(curl -s -o /dev/null -w "%{http_code}" "$base_url/auth")
            if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 500 ]; then
              echo "PLAYWRIGHT_BASE_URL=$base_url" >> "$GITHUB_ENV"
              echo "Using Playwright base URL: $base_url"
              exit 0
            fi

            echo "Preview not ready yet (HTTP $status_code), retry $i/20"
            sleep 6
          done

          echo "Preview URL did not become ready in time: $base_url"
          exit 1

      - name: Validate Playwright env
        run: |
          required_vars=(NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY TEST_API_KEY TEST_USER_ID TEST_USER_PASSWORD INTERNAL_TEST_KEY CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET)
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "Missing required environment variable: $var"
              exit 1
            fi
          done
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
          TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          INTERNAL_TEST_KEY: ${{ secrets.INTERNAL_TEST_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Preflight test auth endpoint
        run: |
          base_url='${{ env.PLAYWRIGHT_BASE_URL }}'

          status_code=$(curl -s -o /tmp/test-auth-response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            -H "x-internal-test-key: ${INTERNAL_TEST_KEY}" \
            -H "x-test-auth: 1" \
            -d '{"api_key":"'"${TEST_API_KEY}"'","user_id":"'"${TEST_USER_ID}"'"}' \
            "$base_url/api/test/auth")

          if [ "$status_code" -ne 200 ]; then
            echo "Preflight auth failed with status $status_code"
            cat /tmp/test-auth-response.txt
            exit 1
          fi
          echo "Preflight auth succeeded"
        env:
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
          TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
          INTERNAL_TEST_KEY: ${{ secrets.INTERNAL_TEST_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Run Playwright smoke suite
        run: npx playwright test --project=public --project=authenticated --grep @smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
          TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          INTERNAL_TEST_KEY: ${{ secrets.INTERNAL_TEST_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}
          CI: true

      - name: Upload Playwright smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report
          retention-days: 7

  nightly-full:
    name: E2E Nightly Full
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: "npm"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm install --prefer-offline

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Set base URL
        run: echo "PLAYWRIGHT_BASE_URL=https://dev.letsboulder.com" >> "$GITHUB_ENV"

      - name: Validate Playwright env
        run: |
          required_vars=(NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY TEST_API_KEY TEST_USER_ID TEST_USER_PASSWORD INTERNAL_TEST_KEY CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET)
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "Missing required environment variable: $var"
              exit 1
            fi
          done
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
          TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          INTERNAL_TEST_KEY: ${{ secrets.INTERNAL_TEST_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Preflight test auth endpoint
        run: |
          base_url='${{ env.PLAYWRIGHT_BASE_URL }}'

          status_code=$(curl -s -o /tmp/test-auth-response.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
            -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
            -H "x-internal-test-key: ${INTERNAL_TEST_KEY}" \
            -H "x-test-auth: 1" \
            -d '{"api_key":"'"${TEST_API_KEY}"'","user_id":"'"${TEST_USER_ID}"'"}' \
            "$base_url/api/test/auth")

          if [ "$status_code" -ne 200 ]; then
            echo "Preflight auth failed with status $status_code"
            cat /tmp/test-auth-response.txt
            exit 1
          fi
          echo "Preflight auth succeeded"
        env:
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
          TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
          INTERNAL_TEST_KEY: ${{ secrets.INTERNAL_TEST_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Run Playwright full suite
        run: npx playwright test --grep @full
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
          TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          INTERNAL_TEST_KEY: ${{ secrets.INTERNAL_TEST_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}
          CI: true

      - name: Upload Playwright nightly report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: playwright-report
          retention-days: 7
