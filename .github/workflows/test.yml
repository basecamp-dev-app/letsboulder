name: CI

on:
  deployment_status:
    branches: [main, dev]
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      playwright_base_url:
        description: "Optional base URL override for Playwright runs"
        required: false
        type: string
  schedule:
    - cron: "0 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read
  statuses: read
  pull-requests: read

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: "npm"

      - name: Install dependencies
        run: npm install --prefer-offline

      - name: Lint
        run: npm run lint

      - name: Check feature structure
        run: npm run check:features

      - name: Verify docs drift
        run: bash docs/verify.sh

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Component Tests
        run: npm run test:components

      - name: Run Integration Tests
        run: npm run test:integration:coverage

      - name: Check type drift
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            MIGRATIONS_CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} -- supabase/migrations/ | wc -l)
            TYPES_CHANGED=$(git diff --name-only ${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }} -- types/database.ts | wc -l)
            if [ "$MIGRATIONS_CHANGED" -gt 0 ] && [ "$TYPES_CHANGED" -eq 0 ]; then
              echo "::error::Migrations were changed but types/database.ts was not regenerated. Run 'supabase gen types typescript --local > types/database.ts' and commit the result."
              exit 1
            fi
            echo "Type drift check passed (migrations: $MIGRATIONS_CHANGED changed, types: $TYPES_CHANGED changed)"
          else
            echo "Skipping type drift check (not a pull_request event)"
          fi

  deploy:
    name: Deploy to Vercel
    needs: [quality, media-worker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel Deployment
        run: |
          echo "Triggering Vercel deployment via Deploy Hook..."
          response=$(curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}")
          echo "Response: $response"

          # Check if response contains a valid Vercel job
          if echo "$response" | grep -q '"state":"PENDING"'; then
            echo "Vercel deployment triggered successfully"
          else
            echo "::error::Failed to trigger Vercel deployment: $response"
            exit 1
          fi
          echo "Vercel deployment triggered successfully"

  media-worker:
    name: Media Worker Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: "npm"

      - name: Install dependencies
        run: npm install --prefer-offline

      - name: Typecheck media worker
        run: npm --prefix apps/media-worker run check

  smoke:
    name: E2E Smoke
    if: |
      (
        github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        (
          github.event.deployment.ref == 'refs/heads/main' ||
          github.event.deployment.ref == 'refs/heads/dev'
        )
      ) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.20.0"
          cache: "npm"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm install --prefer-offline

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit

      - name: Resolve Playwright base URL
        id: resolve_base_url
        uses: actions/github-script@v7
        with:
          script: |
            // Smoke tests only run on deployment_status or workflow_dispatch
            // deployment_status: use target_url from Vercel deployment
            // workflow_dispatch: requires manual playwright_base_url input

            const manualBaseUrl = '${{ github.event.inputs.playwright_base_url || '' }}'.trim();
            if (manualBaseUrl) {
              core.info(`Using manual base URL: ${manualBaseUrl}`);
              core.setOutput('base_url', manualBaseUrl);
              return;
            }

            if (context.eventName === 'deployment_status') {
              const targetUrl = context.payload.deployment_status?.target_url || '';
              if (!targetUrl) {
                core.setFailed('Deployment status event is missing target_url.');
                return;
              }
              core.info(`Using deployment target URL: ${targetUrl}`);
              core.setOutput('base_url', targetUrl);
              return;
            }

            // workflow_dispatch without manual URL - not supported
            core.setFailed('Smoke tests on workflow_dispatch require playwright_base_url input.');

      - name: Wait for preview readiness
        run: |
          base_url='${{ steps.resolve_base_url.outputs.base_url }}'
          if [ -z "$base_url" ]; then
            echo "Failed to resolve PLAYWRIGHT_BASE_URL"
            exit 1
          fi

          # Validate URL matches expected environment
          case "$base_url" in
            *dev.letsboulder.com*|*vercel.app*|*localhost*)
              echo "URL domain validation passed: $base_url"
              ;;
            *letsboulder.com*)
              echo "::error::Resolved URL '$base_url' points to production. Smoke tests must run against dev/staging environments only."
              exit 1
              ;;
            *)
              echo "::error::Unexpected URL domain '$base_url'. Expected dev.letsboulder.com, vercel.app preview, or localhost."
              exit 1
              ;;
          esac

          for i in $(seq 1 20); do
            status_code=$(curl -s -o /dev/null -w "%{http_code}" "$base_url/auth")
            if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 500 ]; then
              echo "PLAYWRIGHT_BASE_URL=$base_url" >> "$GITHUB_ENV"
              echo "Using Playwright base URL: $base_url"
              exit 0
            fi

            echo "Preview not ready yet (HTTP $status_code), retry $i/20"
            sleep 6
          done

          echo "Preview URL did not become ready in time: $base_url"
          exit 1

      - name: Validate Playwright env
        run: |
          required_vars=(NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY DEV_SUPABASE_SERVICE_ROLE_KEY TEST_API_KEY TEST_USER_ID TEST_USER_EMAIL TEST_USER_PASSWORD INTERNAL_TEST_KEY CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET)
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "Missing required environment variable: $var"
              exit 1
            fi
          done
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEV_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
          TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          INTERNAL_TEST_KEY: ${{ secrets.INTERNAL_TEST_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

      - name: Run Playwright smoke suite
        run: npx playwright test --project=public --project=authenticated --grep @smoke
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEV_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
          TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
          TEST_USER_EMAIL: ${{ secrets.TEST_USER_EMAIL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          INTERNAL_TEST_KEY: ${{ secrets.INTERNAL_TEST_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          PLAYWRIGHT_BASE_URL: ${{ env.PLAYWRIGHT_BASE_URL }}
          CI: true
          ENABLE_TEST_AUTH_ENDPOINT: 'true'

      - name: Upload Playwright smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: playwright-report
          retention-days: 7
