name: E2E Tests

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:unit
       
      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Validate Vercel CI secrets
        run: |
          required_vars=(VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID)
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "Missing required environment variable: $var"
              exit 1
            fi
          done
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Pull Vercel preview environment
        run: npx vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Vercel preview
        run: npx vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Vercel preview
        run: |
          deploy_output="$(npx vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})"
          echo "$deploy_output"
          preview_url="$(DEPLOY_OUTPUT="$deploy_output" python3 -c "import os,re; matches=re.findall(r'https://[A-Za-z0-9-]+\\.vercel\\.app', os.environ.get('DEPLOY_OUTPUT', '')); print(matches[-1] if matches else '')")"
          if [ -z "$preview_url" ]; then
            echo "Failed to detect Vercel preview URL from deploy output"
            exit 1
          fi
          echo "PLAYWRIGHT_BASE_URL=$preview_url" >> "$GITHUB_ENV"
          echo "Using Playwright base URL: $preview_url"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      
      - name: Run public E2E tests
        run: npx playwright test --project=public
        env:
          CI: true

      - name: Validate authenticated test env
        run: |
          required_vars=(TEST_API_KEY TEST_USER_ID TEST_USER_PASSWORD)
          for var in "${required_vars[@]}"; do
            if [ -z "${!var}" ]; then
              echo "Missing required environment variable: $var"
              exit 1
            fi
          done
        env:
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
          TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Run authenticated E2E tests
        run: npx playwright test --project=authenticated
        env:
          TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
          TEST_USER_ID: ${{ secrets.TEST_USER_ID }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      - name: notify vercel
        if: always()
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          repository-token: ${{ secrets.VERCEL_REPOSITORY_DISPATCH_TOKEN }}
          name: 'Vercel - letsboulder: E2E Tests'
