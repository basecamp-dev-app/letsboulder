name: Security audits

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, dev]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/media-worker/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Audit root dependencies
        run: npm audit --audit-level=low

      - name: Install media worker dependencies
        run: npm --prefix apps/media-worker ci --ignore-scripts

      - name: Audit media worker dependencies
        run: npm --prefix apps/media-worker audit --audit-level=low
