name: Security audits

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency audits
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.0'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/media-worker/package-lock.json

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Audit root dependencies
        run: npm audit --audit-level=low

      - name: Install media worker dependencies
        run: npm --prefix apps/media-worker ci --ignore-scripts

      - name: Audit media worker dependencies
        run: npm --prefix apps/media-worker audit --audit-level=low
