name: Fix MapLibre 6 imports

on:
  push:
    branches:
      - fix/automate-production-release
    paths:
      - '.github/workflows/fix-maplibre-6-imports.yml'

permissions:
  contents: write

jobs:
  fix-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/automate-production-release

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Update MapLibre imports and marker callback
        run: |
          python3 <<'PY'
          from pathlib import Path

          picker = Path('components/map/MapLibreLocationPicker.tsx')
          text = picker.read_text()
          old_import = "import maplibregl, { type Map as MapLibreMap, type Marker } from 'maplibre-gl'"
          new_import = "import * as maplibregl from 'maplibre-gl'\nimport type { Map as MapLibreMap, Marker } from 'maplibre-gl'"
          assert old_import in text
          text = text.replace(old_import, new_import, 1)
          old_marker = """      markerRef.current = new maplibregl.Marker({ element: createMarkerElement(), draggable: true })
        .setLngLat(lngLat)
        .addTo(map)
      markerRef.current.on('dragend', () => {
        const next = markerRef.current?.getLngLat()
        if (next) onChangeRef.current({ latitude: next.lat, longitude: next.lng })
      })"""
          new_marker = """      const marker = new maplibregl.Marker({ element: createMarkerElement(), draggable: true })
        .setLngLat(lngLat)
        .addTo(map)
      markerRef.current = marker
      marker.on('dragend', () => {
        const next = marker.getLngLat()
        onChangeRef.current({ latitude: next.lat, longitude: next.lng })
      })"""
          assert old_marker in text
          picker.write_text(text.replace(old_marker, new_marker, 1))

          static_map = Path('components/map/MapLibreStaticLocationMap.tsx')
          text = static_map.read_text()
          old_import = "import maplibregl, { type Map as MapLibreMap, type Marker } from 'maplibre-gl'"
          new_import = "import * as maplibregl from 'maplibre-gl'\nimport type { Map as MapLibreMap, Marker } from 'maplibre-gl'"
          assert old_import in text
          static_map.write_text(text.replace(old_import, new_import, 1))

          vector_map = Path('components/map/MapLibreVectorMap.tsx')
          text = vector_map.read_text()
          old_import = "import maplibregl, { type GeoJSONSource, type Map as MapLibreMap } from 'maplibre-gl'"
          new_import = "import * as maplibregl from 'maplibre-gl'\nimport type { GeoJSONSource, Map as MapLibreMap } from 'maplibre-gl'"
          assert old_import in text
          vector_map.write_text(text.replace(old_import, new_import, 1))
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify app typecheck
        run: npm run typecheck:app

      - name: Commit MapLibre compatibility fix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components/map/MapLibreLocationPicker.tsx components/map/MapLibreStaticLocationMap.tsx components/map/MapLibreVectorMap.tsx
          if git diff --cached --quiet; then
            echo 'No MapLibre compatibility changes to commit.'
            exit 0
          fi
          git commit -m 'fix: update MapLibre 6 imports'
          git push origin HEAD:fix/automate-production-release
