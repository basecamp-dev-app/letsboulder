name: Public R2 Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-public-inventory-production
  cancel-in-progress: false

jobs:
  inventory:
    name: Inventory Production Public R2 Bucket
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: lb-prod-media-public
    steps:
      - name: List public R2 objects
        shell: bash
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_PUBLIC_INVENTORY_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_PUBLIC_INVENTORY_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          account_id="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || ! [[ "$account_id" =~ ^[0-9a-f]{32}$ ]]; then
            echo '::error::Missing or invalid R2 inventory configuration'
            exit 1
          fi
          echo "::add-mask::$R2_ACCESS_KEY_ID"
          echo "::add-mask::$R2_SECRET_ACCESS_KEY"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto AWS_EC2_METADATA_DISABLED=true
          raw_inventory="$RUNNER_TEMP/r2-public-inventory-raw.json"
          list_error="$RUNNER_TEMP/r2-public-inventory-error.log"
          trap 'unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; rm -f "$raw_inventory" "$list_error"' EXIT
          if ! aws s3api list-objects-v2 --bucket "$R2_BUCKET" \
            --max-items 1 --no-paginate \
            --endpoint-url "https://${account_id}.r2.cloudflarestorage.com" \
            --output json >/dev/null 2>"$list_error"; then
            echo '::error::R2 bucket access preflight failed. A bucket-scoped R2 Object Read credential for lb-prod-media-public is required.'
            exit 1
          fi
          if ! aws s3api list-objects-v2 --bucket "$R2_BUCKET" \
            --endpoint-url "https://${account_id}.r2.cloudflarestorage.com" \
            --output json >"$raw_inventory" 2>"$list_error"; then
            echo '::error::Unable to list R2 objects. A bucket-scoped R2 Object Read credential for lb-prod-media-public is required.'
            exit 1
          fi
          jq '[.Contents[]? | {Key, Size, LastModified, ETag, StorageClass}] | sort_by(.Key)' \
            "$raw_inventory" > lb-prod-media-public-inventory.json
          jq '{objects: length, bytes: ([.[].Size] | add // 0)}' lb-prod-media-public-inventory.json

      - name: Upload public R2 inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lb-prod-media-public-inventory
          path: lb-prod-media-public-inventory.json
          if-no-files-found: error
          retention-days: 7
