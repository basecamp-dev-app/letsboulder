name: Runtime Audit Staging

on:
  pull_request:
    branches: [staging]
    paths:
      - '.github/workflows/e2e-production-nightly.yml'
      - '.github/workflows/runtime-audit-staging.yml'
      - 'playwright.runtime-audit.config.ts'
      - 'package.json'
      - 'scripts/playwright/**'
      - 'tests/fixtures/runtime-audit.ts'
      - 'tests/mobile-runtime-audit*.spec.ts'
      - 'tests/reporters/runtime-audit-reporter.ts'
      - 'tests/workflows/**'
  workflow_dispatch:

concurrency:
  group: runtime-audit-staging-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  staging-mobile-runtime-audit:
    name: Staging Mobile Runtime Audit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: 'true'
      PLAYWRIGHT_BASE_URL: 'https://staging.letsboulder.com'
      PLAYWRIGHT_SKIP_GLOBAL_SETUP: 'true'
      PLAYWRIGHT_OUTPUT_DIR: 'runtime-audit-work/test-results'
      RUNTIME_AUDIT_REPORT_DIR: 'runtime-audit-work/report'
      RUNTIME_AUDIT_EXPECTED_ROWS: '154'
      RUNTIME_AUDIT_RUN: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: 'npm'
      - name: Validate staging-safe audit configuration
        run: |
          if [ "$PLAYWRIGHT_BASE_URL" != 'https://staging.letsboulder.com' ]; then echo "::error::PLAYWRIGHT_BASE_URL must be https://staging.letsboulder.com"; exit 1; fi
          forbidden_vars=(TEST_API_KEY TEST_USER_ID TEST_USER_EMAIL TEST_USER_PASSWORD TEST_AUTH_PATH_SEGMENT INTERNAL_TEST_KEY SUPABASE_SERVICE_ROLE_KEY DEV_SUPABASE_SERVICE_ROLE_KEY CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET)
          for var in "${forbidden_vars[@]}"; do if [ -n "${!var}" ]; then echo "::error::Forbidden environment variable present: $var"; exit 1; fi; done
      - name: Install dependencies
        run: npm ci --prefer-offline
      - name: Install media worker dependencies
        run: npm --prefix apps/media-worker ci --prefer-offline
      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint
      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run typecheck
      - name: Verify docs
        id: docs
        continue-on-error: true
        run: bash docs/verify.sh
      - name: Workflow regressions
        id: workflow_regressions
        continue-on-error: true
        run: npm run test:workflow-regressions
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-webkit-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium webkit
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit
      - name: Wait for staging readiness
        run: |
          for i in $(seq 1 30); do status_code=$(curl -s -o /dev/null -w "%{http_code}" "$PLAYWRIGHT_BASE_URL/auth"); if [ "$status_code" -ge 200 ] && [ "$status_code" -lt 500 ]; then exit 0; fi; echo "Staging not ready yet (HTTP $status_code), retry $i/30"; sleep 6; done
          echo "Staging URL did not become ready in time: $PLAYWRIGHT_BASE_URL"; exit 1
      - name: Run deterministic mobile runtime audit
        id: audit
        continue-on-error: true
        run: npm run test:e2e:production-audit -- --retries=1
      - name: Inspect runtime audit raw output
        if: always()
        run: node scripts/playwright/runtime-audit-artifacts.mjs inspect --root runtime-audit-work
      - name: Finalize runtime audit evidence
        id: artifacts
        if: always()
        continue-on-error: true
        run: node scripts/playwright/runtime-audit-artifacts.mjs finalize --run-id "${{ github.run_id }}" --expected-rows 154
      - name: Publish runtime audit job summary
        if: always() && hashFiles('runtime-audit-artifacts/summary/runtime-audit-summary.md') != ''
        run: cat runtime-audit-artifacts/summary/runtime-audit-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload runtime audit summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-audit-summary-${{ github.run_id }}
          path: runtime-audit-artifacts/summary
          if-no-files-found: error
          retention-days: 7
      - name: Upload Chromium runtime audit failures
        if: always() && hashFiles('runtime-audit-artifacts/failures/mobile-chrome/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-audit-failures-chromium-${{ github.run_id }}
          path: runtime-audit-artifacts/failures/mobile-chrome
          if-no-files-found: error
          retention-days: 7
      - name: Upload WebKit runtime audit failures
        if: always() && hashFiles('runtime-audit-artifacts/failures/mobile-safari/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-audit-failures-webkit-${{ github.run_id }}
          path: runtime-audit-artifacts/failures/mobile-safari
          if-no-files-found: error
          retention-days: 7
      - name: Enforce staging infrastructure gates
        if: always()
        run: |
          failed=0
          for result in "lint:${{ steps.lint.outcome }}" "typecheck:${{ steps.typecheck.outcome }}" "docs:${{ steps.docs.outcome }}" "workflow-regressions:${{ steps.workflow_regressions.outcome }}" "artifacts:${{ steps.artifacts.outcome }}"; do
            name=${result%%:*}; outcome=${result#*:}; if [ "$outcome" != 'success' ]; then echo "::error::$name gate outcome: $outcome"; failed=1; fi
          done
          if [ "${{ steps.audit.outcome }}" != 'success' ]; then
            if node -e "const m=require('./runtime-audit-artifacts/summary/runtime-audit-evidence.json'); process.exit(m.validationErrors.length || m.harnessFailures.length ? 1 : 0)"; then
              echo "::notice::Staging audit has confirmed application findings only; infrastructure validation passed and failure evidence was retained."
            else
              echo "::error::Staging audit includes harness/infrastructure failures or invalid evidence."
              failed=1
            fi
          fi
          exit "$failed"
